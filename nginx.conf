# Nginx load balancer configuration for Address Book application
# Listens on port 8080 (http://address.test) and distributes requests
# equally between two Spring Boot instances running on ports 8081 and 8082

worker_processes auto;
error_log /mnt/d/workspace/address-j/logs/nginx-error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /mnt/d/workspace/address-j/logs/nginx-access.log;

    # Define upstream servers for load balancing
    # Uses round-robin by default (requests alternate between servers)
    upstream addressapp {
        server localhost:8081;
        server localhost:8082;
    }

    # Server block listening on port 8080
    server {
        listen 8080;
        server_name address.test;

        # Proxy all requests to the upstream addressapp servers
        location / {
            proxy_pass http://addressapp;
            # Preserve original request headers for the upstream servers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
